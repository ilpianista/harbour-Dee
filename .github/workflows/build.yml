name: SailfishOS build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  RELEASE: 5.0.0.43

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - arch: armv7hl
            target: armv7-unknown-linux-gnueabihf
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
          - arch: i486
            target: i686-unknown-linux-gnu

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: prepare
      run: mkdir RPMS

    - name: Build ${{ matrix.arch }}
      run: docker run --rm --privileged -v $PWD:/workspace registry.gitlab.com/whisperfish/sailo-rs/rust-${{ matrix.arch }}-$RELEASE /bin/bash -c "
            mkdir -p build ;
            cd build ;
            cp -r /workspace/* . ;
            export OPENSSL_DIR=/usr ;
            sb2 -t SailfishOS-$RELEASE-${{ matrix.arch }} -m sdk-build cargo build --jobs 1 --release --target ${{ matrix.target }} --target-dir rust/target --manifest-path rust/Cargo.toml --locked ;
            mb2 -t SailfishOS-$RELEASE-${{ matrix.arch }} build ;
            sudo cp -r RPMS/*.rpm /workspace/RPMS"

    - name: Upload build result
      uses: actions/upload-artifact@v5
      with:
        name: rpms-${{ matrix.arch }}
        path: RPMS

  publish:
      name: Publish the release
      needs: build
      if: github.ref_type == 'tag'
      runs-on: ubuntu-latest
      permissions:
        contents: write      # create the release
        id-token: write      # sign the build attestation
        attestations: write  # store it, so Harpoon can verify its own updates
      steps:
        - uses: actions/checkout@v6

        - uses: actions/download-artifact@v8
          with:
            path: RPMS
            merge-multiple: true

        - name: Checksums
          run: |
            cd RPMS
            sha256sum *.rpm > SHA256SUMS
            cat SHA256SUMS

        - uses: actions/attest-build-provenance@v2
          with:
            subject-path: RPMS/*.rpm

        - name: Release notes
          run: |
            awk 'NR > 1 && /^\*/ { exit } NR > 1' rpm/harbour-dee.changes > notes.md
            cat notes.md

        - name: Create the release
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            prerelease=
            case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              # A re-run replaces the release's files.
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y; done
              gh release upload "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            else
              gh release create "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS \
                --title "harbour-Dee $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
            fi
